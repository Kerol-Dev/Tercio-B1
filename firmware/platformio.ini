; Tercio B1 brushless FOC driver firmware.
;
; Same toolchain rules as the S1, FD and IMU (docs/07-firmware.md §7.1):
; pinned platform and core, STM32duino plus ST's HAL, no third-party
; libraries. Milestone F0 is the hardware-independent part: the FOC core
; (src/foc), the S1's planner and tracker (src/control) and a host-side motor
; simulator (src/sim, never built for the MCU). The MCU environment arrives
; with the bring-up firmware (F1/F2).

[platformio]
default_envs = native

; Host-side tests: the FOC core driving the simulated motor.
; Run with: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -O2 -I src -Wall -Wextra -D UNITY_INCLUDE_DOUBLE
build_src_filter = -<*> +<app/*.cpp> +<control/*.cpp> +<foc/*.cpp> +<sim/*.cpp>
test_build_src = yes

; The simulator behind the web UI (firmware/simulator): the same firmware code
; on the simulated bench, in real time. Build with: pio run -e simulator
[env:simulator]
platform = native
build_flags = -std=c++17 -O2 -I src -Wall -Wextra
build_src_filter = -<*> +<app/*.cpp> +<control/*.cpp> +<foc/*.cpp> +<sim/*.cpp> +<simulator/*.cpp>
